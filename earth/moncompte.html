<!DOCTYPE html>
<html lang="fr">
<head>

<link rel="icon" type="image/x-icon" href="favicon.ico">
<script>try{var t=localStorage.getItem('uplanet-theme'); if(t==='light'||t==='dark') document.documentElement.setAttribute('data-mc-theme',t);}catch(e){}</script>
<style>
html { color-scheme:light dark; }
:root, html[data-mc-theme="light"] {
  --mc-bg:#f3f6fb; --mc-surface:#ffffff; --mc-surface2:#eef2f9; --mc-border:#d5dcea; --mc-text:#1b2433; --mc-text2:#566176;
  --mc-accent:#2563eb; --mc-ink:#ffffff; --mc-ok:#15803d; --mc-warn:#b45309; --mc-danger:#b91c1c; --mc-ring:rgba(37,99,235,.35);
  --mc-grad:linear-gradient(135deg,#2563eb,#7c3aed);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-mc-theme="light"]) { --mc-bg:#0e1117; --mc-surface:#161b25; --mc-surface2:#1d2431; --mc-border:#2a3347; --mc-text:#e6eaf2; --mc-text2:#98a2b6;
    --mc-accent:#5b9bff; --mc-ink:#0b1220; --mc-ok:#4ade80; --mc-warn:#fbbf24; --mc-danger:#f87171; --mc-ring:rgba(91,155,255,.4); }
}
html[data-mc-theme="dark"] { --mc-ink:#0b1220; --mc-bg:#0e1117; --mc-surface:#161b25; --mc-surface2:#1d2431; --mc-border:#2a3347; --mc-text:#e6eaf2; --mc-text2:#98a2b6;
  --mc-accent:#5b9bff; --mc-ok:#4ade80; --mc-warn:#fbbf24; --mc-danger:#f87171; --mc-ring:rgba(91,155,255,.4); }
* { box-sizing:border-box; }
body { margin:0; background:var(--mc-bg); color:var(--mc-text); font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
.wrap { max-width:1040px; margin:0 auto; padding:64px 16px 90px; }

.nav { position:sticky; top:52px; z-index:20; display:flex; gap:6px; overflow-x:auto; padding:8px 0; margin:0 0 12px; background:var(--mc-bg); }
.nav .tab { font:inherit; cursor:pointer; white-space:nowrap; padding:6px 14px; border-radius:999px; border:1px solid var(--mc-border); background:var(--mc-surface); color:var(--mc-text); font-size:.82rem; }
.nav .tab[aria-selected="true"] { background:var(--mc-accent); border-color:var(--mc-accent); color:var(--mc-ink); font-weight:600; }
.nav .tab:hover, .nav .tab:focus-visible { border-color:var(--mc-accent); outline:none; }
.pane[hidden] { display:none; }
.nav a { white-space:nowrap; padding:6px 14px; border-radius:999px; border:1px solid var(--mc-border); background:var(--mc-surface); color:var(--mc-text); text-decoration:none; font-size:.82rem; }
.nav a:hover, .nav a:focus-visible { border-color:var(--mc-accent); outline:none; }
.card { background:var(--mc-surface); border:1px solid var(--mc-border); border-radius:14px; padding:16px 18px; margin-bottom:14px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; margin-bottom:14px; }
.stat { background:var(--mc-surface); border:1px solid var(--mc-border); border-left:4px solid var(--mc-border); border-radius:12px; padding:12px 14px; }
.stat.ok { border-left-color:var(--mc-ok); } .stat.warn { border-left-color:var(--mc-warn); } .stat.bad { border-left-color:var(--mc-danger); }
.stat b { display:block; font-size:.74rem; color:var(--mc-text2); font-weight:600; } .stat .v { font-size:1.35rem; font-weight:700; } .stat small { color:var(--mc-text2); font-size:.72rem; display:block; }
.bar { height:8px; border-radius:6px; background:var(--mc-surface2); border:1px solid var(--mc-border); overflow:hidden; margin:6px 0 2px; }
.bar i { display:block; height:100%; background:var(--mc-ok); } .bar i.warn { background:var(--mc-warn); } .bar i.bad { background:var(--mc-danger); }
.todo { display:flex; gap:12px; align-items:center; flex-wrap:wrap; padding:10px 14px; border:1px solid var(--mc-border); border-left-width:4px; border-radius:12px; margin-bottom:8px; background:var(--mc-surface); }
.todo.warn { border-left-color:var(--mc-warn); } .todo.bad { border-left-color:var(--mc-danger); } .todo.info { border-left-color:var(--mc-accent); } .todo.ok { border-left-color:var(--mc-ok); }
.todo .t { flex:1; min-width:220px; } .todo .t b { display:block; }
.btn { display:inline-block; font:inherit; font-size:.82rem; padding:6px 14px; border-radius:10px; border:1px solid var(--mc-border); background:var(--mc-surface2); color:var(--mc-text); cursor:pointer; text-decoration:none; }
.btn:hover, .btn:focus-visible { border-color:var(--mc-accent); outline:none; } .btn.primary { background:var(--mc-accent); border-color:var(--mc-accent); color:var(--mc-ink); } .btn.danger { color:var(--mc-danger); border-color:var(--mc-danger); } .btn[disabled] { opacity:.5; cursor:not-allowed; }
.row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--mc-border); flex-wrap:wrap; }
.row:last-child { border-bottom:none; } .row .t { flex:1; min-width:200px; } .row .t b { display:block; font-size:.9rem; }
.sw { position:relative; display:inline-flex; align-items:center; gap:6px; font-size:.78rem; color:var(--mc-text2); cursor:pointer; user-select:none; }
.sw input { position:absolute; opacity:0; inset:0; width:100%; height:100%; margin:0; cursor:pointer; z-index:1; } .sw .k { width:38px; height:22px; border-radius:999px; background:var(--mc-surface2); border:1px solid var(--mc-border); position:relative; transition:background .15s; flex:none; }
.sw .k::after { content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--mc-text2); transition:transform .15s, background .15s; }
.sw input:checked + .k { background:var(--mc-accent); border-color:var(--mc-accent); } .sw input:checked + .k::after { transform:translateX(16px); background:#fff; }
.sw input:focus-visible + .k { box-shadow:0 0 0 3px var(--mc-ring); } .sw input:disabled + .k { opacity:.45; }
.chips { display:flex; gap:6px; flex-wrap:wrap; } .chip { padding:3px 12px; border-radius:999px; border:1px solid var(--mc-border); background:var(--mc-surface2); font-size:.76rem; cursor:pointer; color:var(--mc-text2); }
.chip.on { background:var(--mc-accent); border-color:var(--mc-accent); color:var(--mc-ink); }
select { font:inherit; font-size:.82rem; padding:5px 8px; border-radius:8px; border:1px solid var(--mc-border); background:var(--mc-surface2); color:var(--mc-text); }
code.pass { font-size:1.2rem; letter-spacing:.2em; padding:6px 14px; border-radius:10px; background:var(--mc-surface2); border:1px dashed var(--mc-border); }
.saved { font-size:.74rem; color:var(--mc-ok); opacity:0; transition:opacity .2s; } .saved.on { opacity:1; }
.state { text-align:center; padding:60px 16px; color:var(--mc-text2); } .state .ic { font-size:2.4rem; }
.toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px); background:var(--mc-text); color:var(--mc-bg); padding:8px 18px; border-radius:10px; font-size:.84rem; opacity:0; pointer-events:none; transition:all .2s; z-index:50; }
.toast.on { opacity:1; transform:translateX(-50%); } .toast.err { background:var(--mc-danger); color:#fff; }
.sec { scroll-margin-top:60px; }
.avatar { width:48px; height:48px; border-radius:50%; background:rgba(255,255,255,.22); display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:700; flex:none; }
.hero a.btn.ghost, .hero .btn.ghost { background:rgba(255,255,255,.16); color:#fff; border-color:rgba(255,255,255,.45); }
h3.grp { font-size:.9rem; margin:12px 0 2px; } .colhead { padding:4px 0; border-bottom:none; } .col { width:78px; text-align:center; justify-content:center; flex:none; }
.stat small { line-height:1.45; } .stat b { font-size:.8rem; }
.svc { border:1px solid var(--mc-border); border-radius:12px; padding:12px 14px; background:var(--mc-surface2); display:flex; flex-direction:column; gap:8px; min-width:0; }
.svc .h { display:flex; align-items:center; gap:8px; } .svc .h b { flex:1; word-break:break-all; }
.badge { display:inline-block; font-size:.7rem; padding:1px 9px; border-radius:999px; border:1px solid var(--mc-border); color:var(--mc-text2); }
.badge.ok { border-color:var(--mc-ok); color:var(--mc-ok); } .badge.warn { border-color:var(--mc-warn); color:var(--mc-warn); } .badge.bad { border-color:var(--mc-danger); color:var(--mc-danger); }
.cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:10px; margin-top:10px; }
input[type=text], input[type=password], textarea { width:100%; font:inherit; font-size:.82rem; padding:7px 10px; border-radius:8px; border:1px solid var(--mc-border); background:var(--mc-surface); color:var(--mc-text); }
textarea { min-height:120px; resize:vertical; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:.8rem; }
label.f { display:block; font-size:.74rem; color:var(--mc-text2); margin:6px 0 2px; }
details.d { border:1px solid var(--mc-border); border-radius:10px; padding:0 12px; margin-top:8px; background:var(--mc-surface); } details.d > summary { cursor:pointer; padding:8px 0; font-size:.84rem; font-weight:600; }
.drop { border:2px dashed var(--mc-border); border-radius:12px; padding:14px; text-align:center; font-size:.82rem; color:var(--mc-text2); margin-top:10px; cursor:pointer; } .drop.over { border-color:var(--mc-accent); color:var(--mc-accent); }
.dirty { color:var(--mc-warn); font-size:.72rem; }
.stack { display:flex; height:16px; border-radius:8px; overflow:hidden; border:1px solid var(--mc-border); margin:8px 0 6px; } .stack i { display:block; min-width:3px; }
.legend { display:flex; gap:14px; flex-wrap:wrap; font-size:.76rem; color:var(--mc-text2); } .legend span i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:5px; vertical-align:middle; }
.yrs { display:flex; align-items:flex-end; gap:6px; height:70px; margin-top:6px; } .yrs div { flex:1; min-width:22px; text-align:center; font-size:.66rem; color:var(--mc-text2); } .yrs b { display:block; background:var(--mc-accent); border-radius:4px 4px 0 0; opacity:.85; margin-bottom:2px; }
.meter { margin:10px 0 2px; } .meter .top { display:flex; align-items:center; gap:10px; flex-wrap:wrap; } .meter .top b { flex:1; min-width:180px; }
.fold { display:flex; align-items:center; gap:10px; padding:7px 0; border-bottom:1px solid var(--mc-border); flex-wrap:wrap; } .fold:last-child { border-bottom:none; } .fold .p { flex:1; min-width:200px; word-break:break-all; font-size:.84rem; } .fold.off .p { text-decoration:line-through; color:var(--mc-text2); }
.heat { width:100%; height:auto; display:block; border-radius:8px; border:1px solid var(--mc-border); }
.sigbox { display:grid; grid-template-columns:minmax(240px,1fr) minmax(240px,1fr); gap:16px; margin-top:10px; } @media (max-width:760px) { .sigbox { grid-template-columns:1fr; } }
.fh { display:flex; flex-direction:column; align-items:center; gap:8px; } .fh-cv { display:block; border-radius:12px; background:radial-gradient(circle at 50% 45%, rgba(91,155,255,.12), transparent 70%); cursor:grab; touch-action:none; max-width:100%; } .fh-cv:active { cursor:grabbing; } .fh-cv:focus-visible { outline:2px solid var(--mc-accent); outline-offset:2px; }
.fh-ctl { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; } .fh-chip { font:inherit; font-size:.74rem; padding:3px 11px; border-radius:999px; border:1px solid var(--mc-border); background:var(--mc-surface2); color:var(--mc-text2); cursor:pointer; } .fh-chip.on { background:var(--mc-accent); border-color:var(--mc-accent); color:var(--mc-ink); } .fh-hint { font-size:.68rem; color:var(--mc-text2); }
.samples { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:8px; }
.mini { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px; }
.mini div { background:var(--mc-surface2); border-radius:10px; padding:8px 10px; } .mini b { display:block; font-size:1.1rem; } .mini span { font-size:.72rem; color:var(--mc-text2); }
.mem-src { display:flex; align-items:center; gap:12px; padding:9px 0; border-bottom:1px solid var(--mc-border); flex-wrap:wrap; } .mem-src:last-child { border-bottom:none; }
.mem-src .t { flex:1; min-width:220px; } .mem-src .t b { display:block; font-size:.88rem; } .mem-src.soon { opacity:.55; }
.mem-bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:12px 0 6px; } .mem-bar input[type=text] { flex:1; min-width:180px; width:auto; }
.mem-grp { font-size:.78rem; font-weight:700; color:var(--mc-text2); text-transform:uppercase; letter-spacing:.04em; margin:16px 0 2px; }
.mem-it { display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px solid var(--mc-border); } .mem-it:last-child { border-bottom:none; }
.mem-it .tx { flex:1; min-width:0; font-size:.88rem; overflow-wrap:anywhere; } .mem-it .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:3px; }
.mem-it .acts { display:flex; gap:4px; flex:none; } .mem-it .acts .btn { padding:3px 9px; font-size:.76rem; }
.mem-it .btn.love { border-color:var(--mc-accent); color:var(--mc-accent); }
.mem-edit { display:flex; gap:6px; flex-wrap:wrap; } .mem-edit input { flex:1; min-width:200px; width:auto; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<body>
<div id="nostr-bar"></div>
<main class="wrap">
  <div id="acct-root"><div class="state"><div class="ic">🔑</div><p>Connectez-vous avec votre MULTIPASS pour gérer votre compte.</p>
    <button class="btn primary" onclick="acctConnect()">⚡ Se connecter</button></div></div>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="nacl-fast.min.js"></script>
<script src="nostr.bundle.js"></script>
<script src="common.js"></script>
<script src="uplanet-header.js"></script>
<script src="presence.js"></script>
<script src="face-hedgehog.js"></script>
<script>
'use strict';
/* Mon compte — un seul écran pour le membre : état, actions à faire, notifications, sécurité, données.
   Auth : NIP-98 uniquement (un événement signé frais par appel, nonce anti-rejeu) — plus de jeton dans l'URL. */
var A = { data: null, saveTimer: null, revealTimer: null };

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function $(id) { return document.getElementById(id); }
function toast(msg, err) { var t = $('toast'); t.textContent = msg; t.className = 'toast on' + (err ? ' err' : ''); clearTimeout(toast._t); toast._t = setTimeout(function() { t.className = 'toast'; }, 2600); }
function apiBase() { if (window.getAPIUrl) { try { return window.getAPIUrl(); } catch (e) {} } return window.location.origin; }
function pubkey() { return (window.NostrState && window.NostrState.userPubkey) || window.userPubkey || ''; }
function nonce() { var a = new Uint8Array(8); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b) { return ('0' + b.toString(16)).slice(-2); }).join(''); }
async function signEvent(tpl) {
  if (window.nostr && typeof window.nostr.signEvent === 'function') { tpl.pubkey = pubkey(); return await window.nostr.signEvent(tpl); }
  if (window.userPrivateKey && window.NostrTools) return window.NostrTools.finishEvent(tpl, window.userPrivateKey);
  throw new Error('Signature impossible : connectez votre MULTIPASS.');
}
async function acctFetch(path, opts) {
  opts = opts || {}; var method = opts.method || 'GET', url = apiBase().replace(/\/$/, '') + path;
  var ev = await signEvent({ kind: 27235, created_at: Math.floor(Date.now() / 1000), tags: [['u', url], ['method', method], ['nonce', nonce()]], content: '' });
  var auth = 'Nostr ' + btoa(unescape(encodeURIComponent(JSON.stringify(ev)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  var headers = { 'Authorization': auth }; if (opts.body) headers['Content-Type'] = 'application/json';
  var r = await fetch(url, { method: method, headers: headers, body: opts.body });
  var d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok) { var m = (d && (d.detail || d.error)) || ('Erreur ' + r.status); var er = new Error(typeof m === 'string' ? m : JSON.stringify(m)); er.status = r.status; throw er; }
  return d;
}
function acctConnect() { if (typeof window.connectNostr === 'function') window.connectNostr(false); else if (window.uphOpenLogin) window.uphOpenLogin(); }

function fmtBytes(n) { var u = ['o', 'Ko', 'Mo', 'Go', 'To'], i = 0; n = n || 0; while (n >= 1024 && i < 4) { n /= 1024; i++; } return (n >= 100 || i === 0 ? Math.round(n) : n.toFixed(1)) + ' ' + u[i]; }
function stat(cls, title, value, sub) { return '<div class="stat ' + cls + '"><b>' + esc(title) + '</b><div class="v">' + value + '</div><small>' + sub + '</small></div>'; }

async function load() {
  try {
    A.data = await acctFetch('/api/account/overview');
    var bal = null;
    if (A.data.g1pub) { try { var br = await fetch(apiBase().replace(/\/$/, '') + '/check_balance?g1pub=' + encodeURIComponent(A.data.g1pub)); bal = br.ok ? await br.json() : null; } catch (e) {} }
    A.bal = bal; render();
  } catch (e) {
    $('acct-root').innerHTML = '<div class="state"><div class="ic">⚠️</div><p>' + esc(e.message) + '</p><button class="btn" onclick="load()">Réessayer</button></div>';
  }
}

// ── Ce qu'il faut faire : le cœur de l'écran ────────────────────────────────
function todos(d, bal, links) {
  var t = [], q = d.quota || {}, n = d.notifications;
  if (q.full) t.push({ cls: 'bad', t: 'Espace plein', d: 'Les nouveaux fichiers sont refusés. Libérez de l\'espace ou changez d\'offre.', a: [['Gérer mon espace', 'ucloud.html#reglages'], q.sponsor_url ? ['Devenir parrain', q.sponsor_url, true] : null] });
  else if (q.over) t.push({ cls: 'warn', t: 'Quota dépassé', d: 'Vous êtes en période de grâce : devenez parrain de l\'infrastructure ou libérez de l\'espace.', a: [q.sponsor_url ? ['Devenir parrain', q.sponsor_url, true] : null, ['Gérer mon espace', 'ucloud.html#reglages']] });
  else if (q.pct >= 85) t.push({ cls: 'warn', t: 'Espace presque plein (' + q.pct + ' %)', d: 'Pensez à faire le ménage (doublons, photos reçues) avant d\'atteindre la limite.', a: [['Gérer mon espace', 'ucloud.html#reglages']] });
  if (bal && parseFloat(bal.balance) < 2) t.push({ cls: 'warn', t: 'Solde bas (' + esc(bal.balance) + ')', d: 'Votre MULTIPASS risque de ne plus être renouvelé automatiquement.', a: [q.sponsor_url ? ['Recharger', q.sponsor_url, true] : null] });
  var fl = n.flux, anyOn = Object.keys(fl).some(function(k) { return fl[k].enabled && (fl[k].email || fl[k].nostr); });
  if (!anyOn) t.push({ cls: 'warn', t: 'Aucune notification active', d: 'Vous ne recevrez ni alertes de solde ni rappels de renouvellement.', a: [['Régler les notifications', '#notifications']] });
  else if (!(fl.alerts.enabled && (fl.alerts.email || fl.alerts.nostr))) t.push({ cls: 'warn', t: 'Alertes du compte coupées', d: 'Solde bas, paiement échoué et sécurité ne vous seront pas signalés.', a: [['Réactiver', '#notifications']] });
  if (d.security.restore_disabled) t.push({ cls: 'info', t: 'Récupération par PASS bloquée', d: 'Choix de sécurité : si vous perdez votre clé, la récupération par e-mail est impossible.', a: [['Voir la sécurité', '#securite']] });
  if (!d.security.pass_active) t.push({ cls: 'info', t: 'Aucun code PASS', d: 'Votre compte ne peut pas être récupéré par e-mail + PASS.', a: [['Voir la sécurité', '#securite']] });
  var stale = links ? links.services.filter(function(x) { return x.has_cookie && x.age_days != null && x.age_days > 90 && x.enabled; }) : [];
  if (stale.length) t.push({ cls: 'warn', t: stale.length + ' cookie(s) à renouveler', d: 'Les sessions de ' + stale.slice(0, 4).map(function(x) { return x.domain; }).join(', ') + (stale.length > 4 ? '…' : '') + ' datent de plus de 90 jours : BRO ne peut probablement plus s\'y connecter.', a: [['Redéposer', '#liens']] });
  return t;
}

function todoHtml(td) {
  return td.length ? td.map(function(x) {
    return '<div class="todo ' + x.cls + '"><div class="t"><b>' + esc(x.t) + '</b><span class="sub">' + esc(x.d) + '</span></div>' + (x.a || []).filter(Boolean).map(function(a) {
      return '<a class="btn' + (a[2] ? ' primary' : '') + '" href="' + esc(a[1]) + '"' + (/^https?:/.test(a[1]) ? ' target="_blank" rel="noopener"' : '') + '>' + esc(a[0]) + '</a>'; }).join('') + '</div>'; }).join('')
    : '<div class="todo ok"><div class="t"><b>✨ Tout est en ordre</b><span class="sub">Aucune action nécessaire pour le moment.</span></div></div>';
}

function render() {
  var d = A.data, q = d.quota || {}, bal = A.bal, n = d.notifications, td = todos(d, bal);

/* Onglets : un seul groupe de sections visible à la fois. Les ancres existantes (#liens, #memoire…) ouvrent
   le bon onglet — UPassport redirige encore vers moncompte.html#liens. */
var TABS = [['compte', 'Mon compte'], ['espace', 'Mon espace'], ['liens', 'Comptes liés'], ['memoire', '🧠 Ce que BRO sait de moi'], ['lifeos', 'Profil IA']];
var TAB_OF = { resume: 'compte', notifications: 'compte', presence: 'compte', securite: 'compte', donnees: 'compte',
               espace: 'espace', liens: 'liens', memoire: 'memoire', lifeos: 'lifeos' };
function showTab(name, keepHash) {
  if (!TABS.some(function(t) { return t[0] === name; })) name = 'compte';
  document.querySelectorAll('.pane').forEach(function(p) { p.hidden = p.getAttribute('data-pane') !== name; });
  document.querySelectorAll('.nav .tab').forEach(function(b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === name ? 'true' : 'false'); });
  if (!keepHash) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }
  window.scrollTo(0, 0);
}
function tabFromHash() {
  var id = (location.hash || '').replace('#', '');
  return TAB_OF[id] || (TABS.some(function(t) { return t[0] === id; }) ? id : 'compte');
}
function bindTabs() {
  document.querySelectorAll('.nav .tab').forEach(function(b) { b.addEventListener('click', function() { showTab(b.getAttribute('data-tab')); }); });
  var t = tabFromHash(); showTab(t, true);
  var id = (location.hash || '').replace('#', '');
  if (TAB_OF[id] && TAB_OF[id] === t && $(id)) setTimeout(function() { $(id).scrollIntoView(); }, 50);   // #securite → l'onglet ET la section
}
window.addEventListener('hashchange', function() { if ($('acct-root') && document.querySelector('.pane')) { var t = tabFromHash(); showTab(t, true); var id = location.hash.replace('#', ''); if ($(id)) $(id).scrollIntoView(); } });

function setTheme(t) { document.documentElement.setAttribute('data-mc-theme', t); try { localStorage.setItem('uplanet-theme', t); } catch (e) {} }
function presetFlux(kind) {
  var fl = A.data.notifications.flux, body = {};
  Object.keys(fl).forEach(function(k) {
    var ess = (k === 'alerts' || k === 'usociety');
    body[k] = kind === 'all' ? { email: true, enabled: true } : { email: ess, nostr: false, enabled: ess };
  });
  if (kind === 'all') Object.keys(body).forEach(function(k) { body[k].nostr = true; });
  savePrefs({ flux: body }).then(function() { render(); });
}

function bind() {
  var tb = $('theme-btn'); if (tb) tb.addEventListener('click', function() {
    var cur = document.documentElement.getAttribute('data-mc-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    setTheme(cur === 'dark' ? 'light' : 'dark');
  });
  document.querySelectorAll('input[data-flux]').forEach(function(i) { i.addEventListener('change', onFlux); });
  var sc = $('kin-scope'); if (sc) sc.addEventListener('change', function() { savePrefs({ kin: { scope: sc.value } }); });
  document.querySelectorAll('.chip[data-kin]').forEach(function(c) {
    function tog() { c.classList.toggle('on'); var ts = [].slice.call(document.querySelectorAll('.chip[data-kin].on')).map(function(x) { return x.getAttribute('data-kin'); }); savePrefs({ kin: { types: ts } }); }
    c.addEventListener('click', tog); c.addEventListener('keydown', function(e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); tog(); } });
  });
  var pb = $('pass-block'); if (pb) pb.addEventListener('change', async function() {
    try { var r = await acctFetch('/api/account/pass', { method: 'POST', body: JSON.stringify({ disable: pb.checked }) }); A.data.security.restore_disabled = r.restore_disabled; toast(r.restore_disabled ? 'Récupération par PASS bloquée' : 'Récupération par PASS réactivée'); render(); }
    catch (e) { pb.checked = !pb.checked; toast(e.message, true); }
  });
}

var _pending = {};
function onFlux(ev) {
  var i = ev.target, k = i.getAttribute('data-flux'), ch = i.getAttribute('data-ch'), important = (k === 'alerts' || k === 'usociety');
  if (!i.checked && important && !confirm('Couper « ' + (A.data.notifications.flux_meta[k] || {}).title + ' » ? Vous pourriez manquer des alertes importantes (solde, stockage, renouvellement).')) { i.checked = true; return; }
  _pending[k] = _pending[k] || {}; _pending[k][ch] = i.checked;
  if (i.checked) _pending[k].enabled = true;
  var row = document.querySelectorAll('input[data-flux="' + k + '"]');
  if (![].some.call(row, function(x) { return x.checked; })) _pending[k].enabled = false;
  clearTimeout(A.saveTimer); A.saveTimer = setTimeout(function() { var f = _pending; _pending = {}; savePrefs({ flux: f }); }, 500);
}
async function savePrefs(body) {
  try { A.data.notifications = Object.assign({}, A.data.notifications, await acctFetch('/api/account/prefs', { method: 'POST', body: JSON.stringify(body) })); var s = $('saved'); if (s) { s.classList.add('on'); setTimeout(function() { s.classList.remove('on'); }, 1600); } }
  catch (e) { toast('Enregistrement impossible : ' + e.message, true); load(); }
}
function togglePresence(i) {
  var st = $('presence-state');
  if (!window.Presence) { i.checked = false; toast('Module de présence indisponible.', true); return; }
  var done = function() { if (st) st.textContent = i.checked ? 'Activé — pris en compte dès la prochaine page connectée.' : 'Désactivé.'; };
  (i.checked ? Presence.enable() : Presence.disable()).then(done, done);
}
async function revealPass() {
  var box = $('pass-box'); if (!box) return;
  try {
    var r = await acctFetch('/api/account/pass/reveal', { method: 'POST' });
    box.innerHTML = '<code class="pass">' + esc(r.pass) + '</code> <button class="btn" id="pass-copy">Copier</button>';
    $('pass-copy').onclick = function() { navigator.clipboard.writeText(r.pass); toast('Code copié'); };
    clearTimeout(A.revealTimer); A.revealTimer = setTimeout(function() { box.innerHTML = '<button class="btn" onclick="revealPass()">👁 Afficher mon code</button>'; }, 20000);
  } catch (e) { toast(e.message, true); }
}


// ── Comptes liés : cookies de session, scrapers BRO, clés d'API ─────────────
async function acctUpload(path, file) {
  var url = apiBase().replace(/\/$/, '') + path;
  var ev = await signEvent({ kind: 27235, created_at: Math.floor(Date.now() / 1000), tags: [['u', url], ['method', 'POST'], ['nonce', nonce()]], content: '' });
  var auth = 'Nostr ' + btoa(unescape(encodeURIComponent(JSON.stringify(ev)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=/g, '');
  var fd = new FormData(); fd.append('file', file, file.name);
  var r = await fetch(url, { method: 'POST', headers: { 'Authorization': auth }, body: fd });
  var d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok || (d && d.success === false)) throw new Error((d && (d.detail || d.message || d.error)) || ('Erreur ' + r.status));
  return d;
}
async function loadLinks() {
  try { A.links = await acctFetch('/api/account/links'); renderLinks(); var tl = $('todo-list'); if (tl) tl.innerHTML = todoHtml(todos(A.data, A.bal, A.links)); }

      if (x.watch && x.watch.length) {

          else h += '<label class="f">Mots-clés (séparés par des virgules)' + (w.channel ? ' — ' + esc(w.channel) : '') + '</label><input type="text" data-kw="' + esc(x.domain) + '|' + esc(w.channel || '') + '" value="' + esc((w.keywords || []).join(', ')) + '">' +

    '<div id="mem-list"></div>' +
    '<div class="mem-bar" style="margin-top:14px"><input type="text" id="mem-new" maxlength="600" placeholder="Ajouter un souvenir : « Je suis allergique aux noix »" aria-label="Nouveau souvenir">' +
    '<select id="mem-newkind" aria-label="Type">' + MEM_KINDS.map(function(k) { return '<option value="' + k[0] + '">' + k[1] + '</option>'; }).join('') + '</select><button class="btn primary" id="mem-add">Ajouter</button></div>' +
    '<p class="sub" style="margin:6px 0 0">🔒 Privé : seul BRO s\'en sert pour vous répondre. 💞 Partagé : un extrait de 40 caractères peut être cité à une personne compatible lors d\'une rencontre.</p>';

function renderMemList() {
  var box = $('mem-list'); if (!box) return;
  var needle = M.q.trim().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  var rows = M.items.filter(function(i) {
    if (M.kind && i.kind !== M.kind) return false;
    return !needle || i.content.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').indexOf(needle) >= 0;
  });
  if (!rows.length) { box.innerHTML = '<p class="sub" style="padding:14px 0">' + (M.items.length ? 'Aucun souvenir ne correspond.' : 'BRO ne sait encore rien de vous. Parlez-lui, cochez une source ci-dessus, ou ajoutez un souvenir.') + '</p>'; return; }
  var h = '', shown = 0, last = null;
  MEM_KINDS.forEach(function(k) {
    var part = rows.filter(function(i) { return i.kind === k[0]; });
    if (!part.length || shown >= M.shown) return;
    h += '<div class="mem-grp">' + k[1] + ' · ' + part.length + '</div>';
    part.forEach(function(i) {
      if (shown >= M.shown) return; shown++;

      h += '<div class="mem-it" data-id="' + esc(i.id) + '"><div class="tx">' +
        (M.editing === i.id ? '<div class="mem-edit"><input type="text" id="mem-edit-in" maxlength="600" value="' + esc(i.content) + '"><button class="btn primary" data-act="save">Enregistrer</button><button class="btn" data-act="cancel">Annuler</button></div>'
                            : esc(i.content)) +
        '<div class="meta"><span class="badge">' + esc(MEM_BADGE[i.source] || i.source) + '</span>' +
        (memDate(i.timestamp) ? '<span class="badge">' + esc(memDate(i.timestamp)) + '</span>' : '') +
        (i.pinned ? '<span class="badge ok" title="Écrit ou corrigé par vous : BRO ne le modifie pas tout seul à partir de vos publications">✍ de votre main</span>' : '') +
        (i.edited ? '<span class="badge ok">corrigé</span>' : (i.confidence < 0.7 ? '<span class="badge warn" title="BRO n\'en est pas sûr : corrigez ou supprimez si c\'est faux">à vérifier</span>' : '')) + '</div></div>' +
        '<div class="acts"><button class="btn' + (love ? ' love' : '') + '" data-act="vis" title="' + (love ? 'Partagé avec LOVE : cliquer pour rendre privé' : 'Privé : cliquer pour autoriser LOVE à le citer') + '">' + (love ? '💞 Partagé' : '🔒 Privé') + '</button>' +
        '<button class="btn" data-act="edit" aria-label="Modifier">✎</button><button class="btn danger" data-act="del" aria-label="Supprimer">✕</button></div></div>';
    });

  if (rows.length > shown) h += '<div style="padding-top:8px"><button class="btn" id="mem-more">Afficher plus (' + (rows.length - shown) + ')</button></div>';
  box.innerHTML = h;
  var inp = $('mem-edit-in'); if (inp) { inp.focus(); inp.select(); }
}

function memItem(id) { return M.items.filter(function(i) { return i.id === id; })[0]; }

async function memCall(path, body, okMsg) {
  if (M.busy) return null; M.busy = true;
  try { var r = await acctFetch(path, { method: 'POST', body: JSON.stringify(body) }); if (okMsg) toast(okMsg); return r; }
  catch (e) { toast(e.message, true); return null; }
  finally { M.busy = false; }
}

function bindMemory() {
  var b = $('mem-body');
  b.querySelectorAll('input[data-src]').forEach(function(cb) { cb.addEventListener('change', async function() {
    var src = cb.getAttribute('data-src'), on = cb.checked;
    if (on && src === 'love_dm' && !confirm('Les souvenirs tirés de vos messages à LOVE seront « partagés » : un extrait de 40 caractères pourra être cité à une personne compatible. Vous pourrez les repasser en privé un par un. Continuer ?')) { cb.checked = false; return; }
    var r = await memCall('/api/account/memory/sources', { source: src, enabled: on }, on ? 'Source activée' : 'Source désactivée');
    if (!r) { cb.checked = !on; return; }
    loadMemory();
  }); });
  b.querySelectorAll('[data-forget]').forEach(function(btn) { btn.addEventListener('click', async function() {
    var src = btn.getAttribute('data-forget');
    if (!confirm('Effacer définitivement tout ce que BRO a appris de « ' + (MEM_SRC[src] ? MEM_SRC[src][1] : src) + ' » ? La source sera aussi décochée.')) return;
    if (await memCall('/api/account/memory/sources/forget', { source: src }, 'Souvenirs effacés')) loadMemory();
  }); });
  $('mem-learn').addEventListener('click', async function() {
    var r = await memCall('/api/account/memory/learn-now', {}, null);
    if (r) { toast('Apprentissage lancé — actualisez dans une minute'); $('mem-learn').disabled = true; setTimeout(loadMemory, 20000); }
  });
  $('mem-refresh').addEventListener('click', loadMemory);
  $('mem-q').addEventListener('input', function(e) { M.q = e.target.value; M.shown = 50; renderMemList(); });
  $('mem-kinds').addEventListener('click', function(e) {
    var k = e.target.getAttribute && e.target.getAttribute('data-kind'); if (k == null) return;
    M.kind = k; M.shown = 50;
    $('mem-kinds').querySelectorAll('.chip').forEach(function(c) { c.classList.toggle('on', c.getAttribute('data-kind') === k); });
    renderMemList();
  });
  $('mem-add').addEventListener('click', addMemItem);
  $('mem-new').addEventListener('keydown', function(e) { if (e.key === 'Enter') addMemItem(); });
  $('mem-list').addEventListener('click', onMemListClick);
  $('mem-list').addEventListener('keydown', function(e) {
    if (e.target.id !== 'mem-edit-in') return;
    if (e.key === 'Enter') saveMemEdit(); else if (e.key === 'Escape') { M.editing = null; renderMemList(); }
  });
}

async function addMemItem() {
  var inp = $('mem-new'), txt = inp.value.trim(); if (txt.length < 3) { toast('Écrivez au moins quelques mots', true); return; }
  if (await memCall('/api/account/memory/items', { content: txt, kind: $('mem-newkind').value }, 'Souvenir ajouté')) { inp.value = ''; loadMemory(); }
}

async function saveMemEdit() {
  var id = M.editing, it = memItem(id), inp = $('mem-edit-in'); if (!it || !inp) return;
  var txt = inp.value.trim(); if (txt === it.content) { M.editing = null; renderMemList(); return; }
  var r = await memCall('/api/account/memory/items/update', { id: id, content: txt }, 'Souvenir corrigé');
  if (r) { M.editing = null; loadMemory(); }
}

async function onMemListClick(e) {
  if (e.target.id === 'mem-more') { M.shown += 50; renderMemList(); return; }
  var act = e.target.getAttribute && e.target.getAttribute('data-act'); if (!act) return;
  var row = e.target.closest('.mem-it'), id = row && row.getAttribute('data-id'), it = id && memItem(id); if (!it) return;
  if (act === 'edit') { M.editing = id; renderMemList(); }
  else if (act === 'cancel') { M.editing = null; renderMemList(); }
  else if (act === 'save') saveMemEdit();
  else if (act === 'del') {
    if (!confirm('Oublier ce souvenir ?\n\n« ' + it.content + ' »\n\nLe texte est effacé, et BRO ne le réapprendra pas à partir de vos publications ou de votre agenda.')) return;
    if (await memCall('/api/account/memory/items/delete', { ids: [id] }, 'Souvenir oublié')) loadMemory();
  } else if (act === 'vis') {
    var to = it.visibility === 'love' ? 'private' : 'love';
    if (to === 'love' && !confirm('Autoriser LOVE à citer ce souvenir (les 40 premiers caractères) à une personne compatible ?\n\n« ' + it.content + ' »')) return;
    var r = await memCall('/api/account/memory/items/update', { id: id, visibility: to }, to === 'love' ? 'Partagé avec LOVE' : 'Redevenu privé');
    if (r) { it.visibility = to; renderMemList(); }
  }
}

async function resetMem(scope, label) {
  if (!confirm('Réinitialiser « ' + label + ' » ? BRO oubliera ces informations. Action irréversible.')) return;
  try { var r = await acctFetch('/api/account/memory/reset', { method: 'POST', body: JSON.stringify({ scope: scope }) }); toast(label + ' réinitialisé (' + r.deleted + ' élément(s))'); load(); }
  catch (e) { toast(e.message, true); }
}

function pctOf(a, b) { return b ? Math.min(100, Math.round(a * 100 / b)) : 0; }
function meter(icon, title, why, done, total, prefKey, on, extra) {
  var pc = pctOf(done, total), cls = pc >= 90 ? 'ok' : (pc >= 50 ? '' : 'warn');
  return '<div class="meter"><div class="top"><b>' + icon + ' ' + title + '</b><span class="badge ' + (cls || '') + '">' + pc + ' %</span>' +
    '<label class="sw"><input type="checkbox" data-pref="' + prefKey + '"' + (on ? ' checked' : '') + '><span class="k"></span> ' + (on ? 'actif' : 'désactivé') + '</label></div>' +
    '<div class="bar"><i class="' + cls + '" style="width:' + pc + '%"></i></div><div class="sub">' + done.toLocaleString('fr-FR') + ' sur ' + total.toLocaleString('fr-FR') + ' · ' + why + (extra ? ' · ' + extra : '') + '</div></div>';
}
function renderSpace() {
  var S = A.space, b = $('espace-body'); if (!b) return;
  if (!S.initialized) { b.innerHTML = '<div class="todo info"><div class="t"><b>Votre cloud n\'est pas encore initialisé</b><span class="sub">Déposez des photos dans FaceCloud pour que la station commence à les ranger, les reconnaître et les décrire.</span></div><a class="btn primary" href="ucloud.html">Ouvrir FaceCloud</a></div>'; return; }
  var q = (A.data && A.data.quota) || {}, cv = S.coverage, pr = S.prefs;
  var order = ['photos', 'videos', 'audio', 'documents', 'received', 'other'].filter(function(k) { return S.kinds[k]; });
  var tot = order.reduce(function(s, k) { return s + S.kinds[k].bytes; }, 0) || 1;
  var h = '<div class="mini"><div><b>' + S.files.toLocaleString('fr-FR') + '</b><span>fichiers</span></div><div><b>' + fmtBytes(S.bytes) + '</b><span>occupés' + (q.quota ? ' sur ' + fmtBytes(q.quota) : '') + '</span></div><div><b>' + (cv.images || 0).toLocaleString('fr-FR') + '</b><span>photos</span></div><div><b>' + (cv.located || 0).toLocaleString('fr-FR') + '</b><span>géolocalisées</span></div></div>';
  h += '<h3 style="margin-top:14px">Composition</h3><div class="stack" role="img" aria-label="Répartition de l\'espace par type">' + order.map(function(k) { return '<i style="flex:' + Math.max(S.kinds[k].bytes, tot * 0.01) + ';background:' + KIND_META[k][1] + '" title="' + esc(KIND_META[k][0]) + '"></i>'; }).join('') + '</div>' +
    '<div class="legend">' + order.map(function(k) { return '<span><i style="background:' + KIND_META[k][1] + '"></i>' + esc(KIND_META[k][0]) + ' · ' + fmtBytes(S.kinds[k].bytes) + ' (' + S.kinds[k].count.toLocaleString('fr-FR') + ')</span>'; }).join('') + '</div>';
  if (S.years.length) { var mx = Math.max.apply(null, S.years.map(function(y) { return y.count; })) || 1; h += '<h3 style="margin-top:14px">Photos par année</h3><div class="yrs">' + S.years.slice().reverse().map(function(y) { return '<div><b style="height:' + Math.max(3, Math.round(y.count / mx * 56)) + 'px" title="' + y.count + ' photos"></b>' + esc(y.year) + '</div>'; }).join('') + '</div>'; }
  h += '<h3 style="margin-top:16px">Ce que la station analyse</h3><p class="sub" style="margin:0">Vous gardez la main : désactivez une analyse, ou écartez des dossiers. Les fichiers restent dans votre cloud, simplement non analysés.</p>' +
    meter('🙂', 'Reconnaissance des visages', 'range vos photos par personne (FaceCloud)', cv.faces_done || 0, cv.images || 0, 'faces', pr.faces, cv.faces_waiting ? cv.faces_waiting + ' en attente' : '') +
    meter('📝', 'Descriptions des photos', 'permet de chercher « la plage en 2019 »', cv.described || 0, cv.images || 0, 'describe', pr.describe, '') +
    meter('🔎', 'Recherche par le sens', 'retrouve une photo à partir de sa description', cv.indexed || 0, cv.described || 0, 'embed', pr.embed, '');
  h += '<h3 style="margin-top:16px">Dossiers</h3><p class="sub" style="margin:0 0 4px">Décochez un dossier pour que la station ne l\'analyse jamais (visages, descriptions, recherche).</p>' +
    (S.folders.length ? S.folders.map(function(f) { return '<div class="fold' + (f.excluded ? ' off' : '') + '"><span class="p">' + esc(f.path) + '</span><span class="sub">' + f.count.toLocaleString('fr-FR') + ' fichiers · ' + fmtBytes(f.bytes) + '</span>' +
      '<label class="sw"><input type="checkbox" data-fold="' + esc(f.path) + '"' + (f.excluded ? '' : ' checked') + '><span class="k"></span> analysé</label></div>'; }).join('') : '<div class="sub">Aucun dossier.</div>');
  h += '<div id="sig-box"></div>';
  b.innerHTML = h;
  document.querySelectorAll('input[data-pref]').forEach(function(i) { i.addEventListener('change', function() { var o = {}; o[i.getAttribute('data-pref')] = i.checked; saveSpacePrefs(o); }); });
  document.querySelectorAll('input[data-fold]').forEach(function(i) { i.addEventListener('change', function() {
    var off = [].slice.call(document.querySelectorAll('input[data-fold]')).filter(function(x) { return !x.checked; }).map(function(x) { return x.getAttribute('data-fold'); });
    // on conserve aussi les exclusions de dossiers qui n'apparaissent pas dans la liste (plus profonds)
    var shown = [].map.call(document.querySelectorAll('input[data-fold]'), function(x) { return x.getAttribute('data-fold'); });
    var keep = (A.space.prefs.exclude || []).filter(function(p) { return shown.indexOf(p) < 0; });
    saveSpacePrefs({ exclude: off.concat(keep) });
  }); });
  if (A.sig) renderSignature();
}
async function saveSpacePrefs(body) {
  try { A.space.prefs = await acctFetch('/api/account/dataspace/prefs', { method: 'POST', body: JSON.stringify(body) }); toast('Préférences d\'analyse enregistrées'); loadSpace(); }
  catch (e) { toast(e.message, true); loadSpace(); }
}
function heat(v, m) { var t = Math.max(-1, Math.min(1, v / m)); return t >= 0 ? 'hsl(28,' + Math.round(90 * t + 10) + '%,' + Math.round(50 - 8 * t) + '%)' : 'hsl(212,' + Math.round(-90 * t + 10) + '%,' + Math.round(50 + 8 * t) + '%)'; }
function strip(vec, m, w, h) {
  var cols = 32, rows = Math.ceil(vec.length / cols), cw = w / cols, ch = h / rows, o = '';
  for (var i = 0; i < vec.length; i++) o += '<rect x="' + ((i % cols) * cw).toFixed(2) + '" y="' + (Math.floor(i / cols) * ch).toFixed(2) + '" width="' + (cw + .3).toFixed(2) + '" height="' + (ch + .3).toFixed(2) + '" fill="' + heat(vec[i], m) + '"><title>dimension ' + i + ' : ' + vec[i] + '</title></rect>';
  return '<svg viewBox="0 0 ' + w + ' ' + h + '" class="heat" role="img" aria-label="Signature de visage, ' + vec.length + ' dimensions">' + o + '</svg>';
}
var _hedge = null;
function renderSignature() {
  var f = A.sig, box = $('sig-box'); if (!box || !f || !f.count || !f.centroid) return;
  var m = Math.max.apply(null, f.centroid.map(Math.abs)) || 1;
  box.innerHTML = '<h3 style="margin-top:18px">🙂 Ma signature faciale</h3><p class="sub" style="margin:0">Les ' + f.dim + ' nombres par lesquels la station reconnaît votre visage, moyennés sur vos ' + f.count.toLocaleString('fr-FR') + ' photos. Chaque piquant du hérisson est une dimension : plus il est long, plus ce trait vous distingue. Aucune photo n\'est stockée dans ce vecteur, et il ne quitte pas la station.</p>' +
    '<div class="sigbox"><div id="hedgehog"></div><div>' +
    '<div class="row"><div class="t"><b>Cohésion</b><span class="sub">ressemblance moyenne de vos visages avec leur signature</span></div><b>' + Math.round(f.cohesion * 100) + ' %</b></div>' +
    '<div class="row"><div class="t"><b>Ressemblance minimale</b><span class="sub">votre visage le plus atypique</span></div><b>' + Math.round(f.worst * 100) + ' %</b></div>' +
    '<h3 style="margin-top:12px">Le damier</h3>' + strip(f.centroid, m, 320, 160) + '<div class="sub">Les mêmes ' + f.dim + ' valeurs à plat : <span style="color:hsl(28,100%,50%)">■</span> positive, <span style="color:hsl(212,100%,50%)">■</span> négative</div>' +
    '<div class="samples">' + f.vectors.map(function(v) { return '<div>' + strip(v.vector, m * 1.6, 160, 40) + '<div class="sub">' + esc(v.label) + ' · ' + Math.round(v.cos * 100) + ' %</div></div>'; }).join('') + '</div></div></div>';
  if (_hedge) _hedge.destroy();
  if (window.FaceHedgehog) _hedge = FaceHedgehog.mount($('hedgehog'), { items: [{ label: 'Ma signature', vector: f.centroid, sub: 'moyenne de vos visages' }].concat(f.vectors.map(function(v) { return { label: v.label.replace('le plus ', ''), vector: v.vector, sub: Math.round(v.cos * 100) + ' % de ressemblance' }; })) });
}

function onConn() { if (pubkey() && window.isNostrConnected && !A.data) { $('acct-root').innerHTML = '<div class="state"><div class="ic">⏳</div><p>Chargement de votre compte…</p></div>'; load(); } }
document.addEventListener('nostr:connected', onConn);
if (window.waitForConnection) window.waitForConnection(onConn);
onConn();
</script>
